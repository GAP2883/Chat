name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          lfs: true

    # --- DEBUG & EXTRACTION STEP ---
    # This lists the directory contents to ensure your zip file actually exists before unzipping
    - name: Verify and Extract app project
      run: |
        echo "=== Current Directory Contents ==="
        ls -la
        
        echo "=== Extracting Project ==="
        if [ -f "BhagavatamReader.zip" ]; then
          unzip BhagavatamReader.zip
        else
          echo "ERROR: BhagavatamReader.zip not found in the root directory!"
          echo "Please ensure the file is committed to your repository or downloaded properly."
          exit 1
        fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # Options: zulu, temurin, adopt
        java-version: '17'   # Match this to your project's required Java version (11, 17, or 21)
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
